services:
  micro-load:
    build: .
    image: micro-load:local
    container_name: micro-load
    restart: unless-stopped
    ports:
      # Localhost only. Put a reverse proxy or a tailnet in front to reach it from your phone.
      - "127.0.0.1:8766:8766"
    environment:
      MICROLOAD_PASSWORD: ${MICROLOAD_PASSWORD:-}
      MICROLOAD_USER: ${MICROLOAD_USER:-microload}
    volumes:
      - micro-load-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  micro-load-data:
