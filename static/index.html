<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Micro Load</title>
<meta name="description" content="Workout logbook that compares every set to last time and sets one small goal for next session">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Micro Load">
<meta name="theme-color" content="#F4F4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav class="tabbar" id="tabs" role="tablist" aria-label="Sections" hidden>
    <div class="brand"><img src="icon-180.png" alt="">Micro Load</div>
    <button role="tab" data-act="tab" data-v="train" aria-selected="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Train</button>
    <button role="tab" data-act="tab" data-v="history" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
    <button role="tab" data-act="tab" data-v="goals" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Goals</button>
    <button role="tab" data-act="tab" data-v="exercises" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r=".9"/><circle cx="4.5" cy="12" r=".9"/><circle cx="4.5" cy="17.5" r=".9"/></svg>Exercises</button>
    <button role="tab" data-act="tab" data-v="settings" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>Settings</button>
  </nav>
  <main id="main">
    <section id="v-onboard" class="onboard" hidden></section>
    <section id="v-train" hidden></section>
    <section id="v-history" hidden></section>
    <section id="v-goals" hidden></section>
    <section id="v-exercises" hidden></section>
    <section id="v-settings" hidden></section>
  </main>
</div>
<div id="timer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<datalist id="labels"></datalist>
<datalist id="groups"></datalist>

<noscript><p>Micro Load needs JavaScript</p></noscript>
<script src="Sortable.min.js"></script>
<script src="js/exercises.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
